# Automatyczne wgrywanie reguł bazy (firestore.rules) do Firebase po każdej zmianie w repozytorium.
# Wymaga sekretu FIREBASE_SERVICE_ACCOUNT (klucz konta usługi z Firebase, plik JSON).
name: Reguły Firestore

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Klucz konta usługi
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Brak sekretu FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Wgraj reguły
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          cd "$RUNNER_TEMP" && npm i -s google-auth-library@9 >/dev/null
          cat > deploy.cjs <<'JS'
          const fs=require('fs');const {GoogleAuth}=require('google-auth-library');
          (async()=>{
            const P='cargoplannerpro',B='https://firebaserules.googleapis.com/v1/projects/'+P;
            const c=await new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']}).getClient();
            const src=fs.readFileSync(process.env.GITHUB_WORKSPACE+'/firestore.rules','utf8');
            const rs=(await c.request({url:B+'/rulesets',method:'POST',data:{source:{files:[{name:'firestore.rules',content:src}]}}})).data;
            console.log('Ruleset:',rs.name);
            const rel='projects/'+P+'/releases/cloud.firestore';
            await c.request({url:'https://firebaserules.googleapis.com/v1/'+rel,method:'PATCH',data:{release:{name:rel,rulesetName:rs.name}}});
            console.log('Reguły wgrane ✔');
          })().catch(e=>{console.error(e.response?.data?JSON.stringify(e.response.data):e.message);process.exit(1)});
          JS
          node deploy.cjs
